latent_dim: 256
hidden_dim: 512
dropout: 0.1
use_layernorm: true

# h -> z head used only by the contrastive loss. Retrieval uses h, the output
# of the modality-specific adapters above this head.
contrastive_head_type: mlp  # identity | linear | mlp
contrastive_head_hidden_dim: 512
contrastive_head_dropout: 0.0
